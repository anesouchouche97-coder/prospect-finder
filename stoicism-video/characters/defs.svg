<svg xmlns="http://www.w3.org/2000/svg" width="0" height="0">
<!-- Paste the <filter> into your scene <svg><defs>, replacing PFX with your scene prefix (s1, s2...). Rig.boil steps its seed. -->
<defs>
<filter id="PFX-ink" class="ink-boil" x="-15%" y="-15%" width="130%" height="130%" color-interpolation-filters="sRGB">
  <feTurbulence class="ink-turb" type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="3" result="n"/>
  <feDisplacementMap in="SourceGraphic" in2="n" scale="5" xChannelSelector="R" yChannelSelector="G"/>
</filter>
</defs>
</svg>
