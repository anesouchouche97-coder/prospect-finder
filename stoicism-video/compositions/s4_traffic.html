      const C = "50% 50%";
      function pop(sel, t, d) {
        F(sel, { opacity: 0, scale: 0.2, transformOrigin: C }, { opacity: 1, scale: 1, transformOrigin: C, duration: d || 0.3, ease: "back.out(2.6)" }, t);
      }
      function out(sel, t, d) { F(sel, { opacity: 1 }, { opacity: 0, duration: d || 0.25, ease: "power2.in" }, t); }
      function shake(t, amp, n) {
        n = n || 5; let prev = 0;
        for (let i = 0; i < n; i++) {
          const v = i === n - 1 ? 0 : amp * (i % 2 ? -1 : 1) * (1 - i / n);
          F("#s4-shake", { x: prev, y: prev * 0.4 }, { x: v, y: v * 0.4, duration: 0.045, ease: "none" }, t + i * 0.045); prev = v;

      }

      F("#s4-turb", { attr: { seed: 1 } }, { attr: { seed: 154 }, duration: D, ease: "steps(153)" }, 0);

      F("#s4-cam", { scale: 1.0, svgOrigin: "620 640" }, { scale: 1.12, svgOrigin: "620 640", duration: 0.4, ease: "power3.out" }, 4.38);
      F("#s4-cam", { scale: 1.12, svgOrigin: "620 640" }, { scale: 1.04, svgOrigin: "620 640", duration: 0.7, ease: "power2.inOut" }, 6.0);
      F("#s4-cam", { scale: 1.04, svgOrigin: "620 640" }, { scale: 1.0, svgOrigin: "620 640", duration: 0.7, ease: "power2.inOut" }, 9.84);
      F("#s4-cam", { scale: 1.0, svgOrigin: "620 640" }, { scale: 1.05, svgOrigin: "620 640", duration: 1.4, ease: "sine.inOut" }, 11.1);

      // 0.14 Example
      pop("#s4-example", 0.12, 0.3); out("#s4-example", 2.9);
      // idle engine rumble on our car (angry phase)
      for (let i = 0; i < 12; i++) F("#s4-car-mv", { y: 0 }, { y: -3, duration: 0.12, ease: "sine.inOut", yoyo: true, repeat: 1 }, 0.3 + i * 0.5);
      // 0.91 "stuck": HONK
      pop("#s4-honk", 0.92, 0.2);
      F("#s4-honk", { rotation: 0, transformOrigin: C }, { rotation: 8, transformOrigin: C, duration: 0.06, yoyo: true, repeat: 5, ease: "none" }, 1.1);
      out("#s4-honk", 1.55, 0.15);
      F("#s4-alex-mv", { y: 0 }, { y: 12, duration: 0.08, ease: "power2.out", yoyo: true, repeat: 1 }, 0.92);
