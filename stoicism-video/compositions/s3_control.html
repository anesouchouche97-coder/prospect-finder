        F(sel, { scale: 1, rotation: 0, transformOrigin: C }, { scale: s, rotation: rot, transformOrigin: C, duration: dur, ease: "power1.in" }, t);
      }
      // basket catch: quick squash of back + front
      function catchIt(which, t) {
        F(["#s3-" + which + "-back", "#s3-" + which + "-front"], { scaleY: 0.9, scaleX: 1.05, svgOrigin: "0 185" },
          { scaleY: 1, scaleX: 1, svgOrigin: "0 185", duration: 0.3, ease: "elastic.out(1, 0.45)" }, t);

      function shake(t, amp) {
        const k = [amp, -amp * 0.8, amp * 0.5, -amp * 0.3, 0];
        let prev = 0;
        k.forEach((v, i) => { F("#s3-shake", { x: prev, y: -prev * 0.5 }, { x: v, y: -v * 0.5, duration: 0.045, ease: "none" }, t + i * 0.045); prev = v; });

        F(sel, { scaleY: 1, transformOrigin: C }, { scaleY: 0.1, transformOrigin: C, duration: 0.06, ease: "power1.in" }, t);

      }

      const links = [["#s3-link1", -40, -120, -200], ["#s3-link2", 60, -140, 260], ["#s3-link3", -90, -90, -300], ["#s3-link4", -60, -150, 180], ["#s3-link5", -140, -60, -240]];

        F(s, { y: 0 }, { y: dy, duration: 0.22, ease: "power2.out" }, 2.7);
